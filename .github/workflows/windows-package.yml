# Windows cross-build package (MinGW on ubuntu-24.04).
# No model included: dlssnr.bin must be added locally after download.
# This avoids distributing NVIDIA's weights and needs no secrets.
name: Windows package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build mingw-w64 python3 zip unzip

      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            artifacts/ref
            deps/GE-Proton*
          key: deps-win-${{ hashFiles('fetch_deps.sh') }}
          restore-keys: deps-win-

      - name: Fetch dependencies (Windows cross-build)
        run: bash fetch_deps.sh --windows

      - name: Build package
        run: bash windows/build/build_package.sh

      - name: Collect artifacts
        run: |
          mkdir -p out
          find . -maxdepth 4 -type f -name '*.zip' ! -path './out/*' -print
          find . -maxdepth 4 -type f -name '*.zip' ! -path './out/*' -exec cp -t out/ {} +
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: DLSSNR-AMD-Windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/*.zip --clobber

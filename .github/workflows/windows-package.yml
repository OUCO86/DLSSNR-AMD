# Windows cross-build package (MinGW on ubuntu-24.04).
# Uses a dummy dlssnr.bin so CI can pass without NVIDIA's weights.
# IMPORTANT: replace dlssnr.bin in the zip with the real one before installing.
name: Windows package

on:
  push:
    branches: [main, win]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build mingw-w64 python3 zip unzip

      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            artifacts/ref
            deps/GE-Proton*
          key: deps-win-${{ hashFiles('fetch_deps.sh') }}
          restore-keys: |
            deps-win-

      - name: Fetch dependencies (Windows cross-build)
        run: bash fetch_deps.sh --windows

      - name: Build package (dummy model)
        run: |
          # fake dlssnr.bin, ~141MB like the real one; replace after download
          dd if=/dev/zero of=dlssnr.bin bs=1M count=141 status=none
          echo "dummy size: $(du -h dlssnr.bin | cut -f1)"
          NR_MODEL=$PWD/dlssnr.bin bash windows/build/build_package.sh

      - name: Collect artifacts
        run: |
          mkdir -p out
          find . -maxdepth 4 -type f -name '*.zip' ! -path './out/*' -print
          find . -maxdepth 4 -type f -name '*.zip' ! -path './out/*' -exec cp -t out/ {} +
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: DLSSNR-AMD-Windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/*.zip --clobber
